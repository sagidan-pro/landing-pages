<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>Tal Bitton</title>
<meta name="description" content="קביעת תור אצל Tal Bitton">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Frank+Ruhl+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b0b;--paper:#f2efe8;--muted:#777168;--line:#d7d0c5;--lime:#c7ff3d;
  --glass-bg:rgba(255,255,255,.14);--glass-bg-strong:rgba(255,255,255,.22);
  --glass-border:rgba(255,255,255,.38);--glass-highlight:rgba(255,255,255,.55)}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:"Assistant",Arial,sans-serif;overflow-x:hidden;
  background:var(--paper);
  position:relative
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 12% 8%, #ffd9a0 0%, transparent 38%),
    radial-gradient(circle at 85% 18%, #c7ff3d 0%, transparent 34%),
    radial-gradient(circle at 25% 82%, #9ad4ff 0%, transparent 40%),
    radial-gradient(circle at 90% 88%, #ffb3d1 0%, transparent 36%),
    var(--paper);
  filter:blur(60px) saturate(130%);
  opacity:.55
}
a{color:inherit}.shell{width:min(1500px,calc(100% - 14px));margin:0 auto;padding:7px 0 36px}
.hero{
  background:rgba(11,11,11,.78);
  backdrop-filter:blur(40px) saturate(140%);
  -webkit-backdrop-filter:blur(40px) saturate(140%);
  border:1px solid rgba(255,255,255,.08);
  color:#fff;border-radius:22px;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;position:relative
}
.hero-brand{
  padding:34px 18px 26px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:300px
}
.brand-title{
  margin:0;
  font-family:"Assistant",Arial,sans-serif;
  font-weight:700;
  font-size:clamp(54px,16vw,146px);
  line-height:.86;
  letter-spacing:-.07em;
  direction:ltr;
  unicode-bidi:isolate;
  text-transform:uppercase;
  white-space:nowrap;
  max-width:100%
}
.brand-title .dot{color:#fff}
.booking-area{
  background:
    radial-gradient(circle at 18% 14%, rgba(199,255,61,.16), transparent 26%),
    radial-gradient(circle at 88% 84%, rgba(11,11,11,.08), transparent 28%),
    linear-gradient(145deg,#ebe4d8 0%,#f7f3ec 60%,#e7dfd2 100%);
  padding:18px;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}
.booking-card{
  width:100%;
  max-width:600px;
  background:var(--glass-bg-strong);
  border:1px solid var(--glass-border);
  border-radius:28px;
  padding:26px 22px 22px;
  box-shadow:
    0 24px 70px rgba(44,33,18,.16),
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  position:relative;
  overflow:hidden
}
.booking-card h2{
  margin:0 0 22px;
  font-family:"Assistant",Arial,sans-serif;
  font-size:38px;
  line-height:1;
  font-weight:700;
  letter-spacing:-.04em;
  color:#0b0b0b
}
.booking-card .sub{display:none}
.field{margin-bottom:18px} label{
  display:block;
  margin:0 0 8px;
  font-weight:600;
  font-size:13px;
  color:#4d4943
}
input,select{
  width:100%;
  appearance:none;
  border:0;
  border-bottom:1.5px solid #aaa398;
  background:transparent;
  border-radius:0;
  padding:13px 2px 12px;
  font:inherit;
  font-size:18px;
  color:var(--ink);
  outline:none;
  transition:.2s
}
input:focus,select:focus{
  border-bottom-color:var(--ink);
  background:transparent;
  box-shadow:none
}
.service-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}.service-option input{display:none}
.service-option span{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:64px;
  padding:12px 10px;
  border:1px solid var(--glass-border);
  background:var(--glass-bg);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)
}
.service-option input:checked + span{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
  box-shadow:none
}
.row{display:grid;grid-template-columns:1fr;gap:0}
.submit{
  width:100%;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:rgba(11,11,11,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  min-height:64px;
  padding:17px 22px;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  margin-top:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)
}
.submit:hover{transform:translateY(-1px);background:rgba(36,36,36,.92)}
.submit:disabled{opacity:.55;cursor:not-allowed;transform:none}
select:disabled{opacity:.65}
.success{display:none;padding:36px 12px;text-align:center}.success .check{width:62px;height:62px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 18px;font-size:28px;font-weight:800}
.success h3{margin:0 0 8px;font-family:"Frank Ruhl Libre",serif;font-size:30px}.success p{margin:0;color:var(--muted)}
.lookbook{padding:58px 0 18px}.section-kicker{font-size:12px;color:var(--muted);margin-bottom:8px}
.section-title{margin:0 0 24px;font-family:"Frank Ruhl Libre",serif;font-size:clamp(52px,15vw,88px);line-height:.92;letter-spacing:-.05em}

/* --- reel carousel (story-style, snap scroll) --- */
.reel-grid{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:8px}
.reel-grid::-webkit-scrollbar{display:none}
.reel{
  flex:0 0 78vw;max-width:340px;aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(160deg,#242424,#0d0d0d 72%);color:#fff;scroll-snap-align:center;
  opacity:.45;transition:opacity .25s ease;
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 14px 34px rgba(0,0,0,.18)
}
.reel.is-active{opacity:1}
.reel video{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#707070;font-size:12px}
.reel-mute{
  position:absolute;bottom:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)
}
.reel-mute svg{width:16px;height:16px;display:block}
.reel-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.reel-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.reel-dot.is-active{width:16px;border-radius:3px;background:var(--ink)}

.instagram{
  margin-top:28px;border:1px solid var(--glass-border);border-radius:20px;overflow:hidden;
  background:var(--glass-bg);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-highlight)
}
.instagram a{text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;font-weight:700;font-size:18px}
.ig-icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--glass-border);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.location{margin-top:28px}
.map-wrap{
  min-height:330px;border-radius:22px;overflow:hidden;background:#ddd;
  border:1px solid var(--glass-border);
  box-shadow:0 18px 48px rgba(0,0,0,.10), inset 0 1px 0 var(--glass-highlight)
}
.map-wrap iframe{width:100%;height:100%;min-height:330px;border:0;display:block}.location-action{padding-top:16px}
.nav-btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:66px;border-radius:16px;
  background:rgba(11,11,11,.88);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  color:#fff;text-decoration:none;font-size:23px;font-weight:800
}
footer{padding:22px 4px 0;color:#918a7f;font-size:12px;text-align:center}
@media(min-width:760px){
.shell{width:min(1500px,calc(100% - 30px));padding-top:15px}.hero{min-height:760px;display:grid;grid-template-columns:1.05fr .95fr;border-radius:30px}
.hero-brand{min-height:760px;padding:40px}.brand-title{font-size:clamp(100px,11vw,175px)}.booking-area{padding:34px}.booking-card{padding:30px}
.row{grid-template-columns:1fr 1fr;gap:10px}
.reel-grid{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}
.reel{max-width:none;opacity:1}
.lookbook{padding-top:82px}.instagram a{padding:22px 26px}.map-wrap,.map-wrap iframe{min-height:440px}.nav-btn{max-width:520px;margin:0 auto;min-height:72px;font-size:27px}}

.ig-top{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  text-decoration:none;
  background:radial-gradient(circle at 30% 110%,#ffd600 0 10%,#ff7a00 28%,#ff0169 52%,#d300c5 72%,#7638fa 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.28);
  transition:.2s ease;
}
.ig-top:hover{transform:translateY(-2px) scale(1.03)}
.ig-top svg{width:27px;height:27px;display:block}

.booking-card:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(199,255,61,.13);
  top:-70px;
  left:-60px;
  filter:blur(2px);
  pointer-events:none;
}
.booking-card:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(0,0,0,.035);
  bottom:-100px;
  right:-80px;
  pointer-events:none;
}
.booking-card > *{position:relative;z-index:1}

.barber-bubble{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  color:#111;
  border-radius:999px;
  padding:14px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.7);
  margin-bottom:34px;
  font-family:"Assistant",Arial,sans-serif;
  font-size:24px;
  font-weight:500;
  line-height:1;
  direction:ltr;
  animation:barberFloat 3.2s ease-in-out infinite;
  transform-origin:center;
}
.barber-emoji{
  display:inline-block;
  font-size:30px;
  animation:barberPoleWiggle 2.2s ease-in-out infinite;
}
@keyframes barberFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-8px) rotate(1deg)}
}
@keyframes barberPoleWiggle{
  0%,100%{transform:rotate(-5deg) scale(1)}
  50%{transform:rotate(6deg) scale(1.06)}
}

@media(max-width:759px){
  .shell{width:100%;padding:0}
  .hero{
    border-radius:0 0 26px 26px;
    min-height:auto;
  }
  .hero-brand{
    min-height:330px;
    padding:78px 18px 42px;
  }
  .brand-title{
    font-size:clamp(56px,17.5vw,88px);

  }

  }

  }

  }
  .booking-card h2{

  }

  }

  }

  }

  }
  .map-wrap,.map-wrap iframe{
    min-height:300px;
  }
  .nav-btn{
    min-height:62px;

  }
  .ig-top{
    top:14px;

  }
}
@media(min-width:760px){
  .hero{
    min-height:760px;
    grid-template-columns:1.08fr .92fr;
  }
  .hero-brand{
    min-height:760px;

  }

  }

    font-size:clamp(92px,10.4vw,170px);
  }

}
@media(prefers-reduced-motion:reduce){
  .barber-bubble,.barber-emoji{animation:none}
}

@media(min-width:760px){
  .ig-top{
    top:24px;
    left:24px;
    width:52px;

    border-radius:15px;
    box-shadow:0 10px 24px rgba(0,0,0,.24);
  }
}

/* ===== TAL BITTON WOW BOOKING ===== */
.hero-wow{
  min-height:760px!important;
  display:grid!important;
  grid-template-columns:46% 54%!important;
  background:#0a0a0a!important;
  border-radius:30px!important;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 28px 90px rgba(0,0,0,.18);
}

.booking-wow{
  position:relative;
  padding:34px!important;
  background:
    radial-gradient(circle at 8% 4%,rgba(224,201,151,.28),transparent 25%),
    radial-gradient(circle at 90% 88%,rgba(255,255,255,.72),transparent 28%),
    linear-gradient(145deg,#e7dece 0%,#f5efe6 48%,#ddd2bf 100%)!important;
}

.booking-wow:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 0 96%,rgba(158,121,65,.35) 100%);
  pointer-events:none;
}

.booking-card-wow{
  max-width:590px!important;
  min-height:690px;
  padding:36px 34px 28px!important;
  border-radius:34px!important;
  background:
    linear-gradient(145deg,rgba(255,255,255,.83),rgba(247,242,232,.68))!important;
  border:1px solid rgba(255,255,255,.88)!important;
  box-shadow:
    0 35px 80px rgba(62,46,24,.16),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 0 0 1px rgba(147,114,64,.08)!important;
  backdrop-filter:blur(34px) saturate(155%)!important;
  -webkit-backdrop-filter:blur(34px) saturate(155%)!important;
}

.booking-card-wow:before{
  width:230px!important;
  height:230px!important;
  background:radial-gradient(circle,rgba(221,196,139,.22),transparent 68%)!important;
  top:-92px!important;
  left:-80px!important;
}
.booking-card-wow:after{
  width:260px!important;
  height:260px!important;
  background:radial-gradient(circle,rgba(20,20,20,.045),transparent 66%)!important;
}

.booking-eyebrow{
  font-size:10px;
  letter-spacing:.28em;
  color:#8d806e;
  direction:ltr;
  text-align:right;
  margin-bottom:13px;
  font-weight:700;
}
.booking-card-wow h2{
  font-size:54px!important;
  margin:0 0 10px!important;
  color:#0b0b0b!important;
  letter-spacing:-.06em!important;
  line-height:.95!important;
}
.booking-intro{
  margin:0 0 26px;
  color:#6c6459;
  font-size:15px;
  line-height:1.5;
}

.booking-card-wow .field{margin-bottom:18px}
.booking-card-wow label{
  color:#292621!important;
  font-size:13px!important;
  margin-bottom:8px!important;
}

.service-grid{
  gap:10px!important;
}
.booking-card-wow .service-option span{
  min-height:58px!important;
  border-radius:999px!important;
  border:1px solid rgba(104,91,72,.26)!important;
  background:rgba(255,255,255,.28)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85)!important;
  font-size:16px!important;
  transition:.25s ease!important;
}
.booking-card-wow .service-option span:hover{
  transform:translateY(-1px);

}
.booking-card-wow .service-option input:checked + span{
  background:#111!important;

}

.input-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.input-shell{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:56px;
  padding:0 14px;
  border:1px solid rgba(106,94,77,.22);
  border-radius:16px;
  background:rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82);
  transition:.2s ease;
}
.input-shell:focus-within{
  border-color:rgba(111,86,48,.55);
  background:rgba(255,255,255,.44);
  box-shadow:0 0 0 3px rgba(171,135,78,.08), inset 0 1px 0 rgba(255,255,255,.9);
}
.input-shell svg{
  width:19px;
  height:19px;
  color:#6e665d;
  flex:0 0 auto;
}
.input-shell input{
  border:0!important;
  padding:0!important;
  background:transparent!important;
  box-shadow:none!important;
  font-size:16px!important;
  min-width:0;
}
.input-shell input:focus{border:0!important}

.booking-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(88,75,56,.24),transparent);
  margin:6px 0 18px;
}
.field-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
.field-head label{margin:0!important}
.field-note{
  font-size:11px;
  color:#918777;
}
.date-shell input{
  direction:ltr;
  text-align:right;
  color:#111;
}

.time-slots{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;

      <video muted loop playsinline preload="none" poster="" data-src="videos/reel-04.mp4"></video>
      <button class="reel-mute" aria-label="הפעל קול" data-muted="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>
      </button>
    </article>
  </div>
  <div class="story-progress" id="reelDots" aria-label="התקדמות סרטונים"></div>
  <div class="story-controls" aria-hidden="false">
    <button class="story-nav story-prev" id="storyPrev" type="button" aria-label="הסרטון הקודם">‹</button>
    <button class="story-nav story-next" id="storyNext" type="button" aria-label="הסרטון הבא">›</button>
  </div>
</section>

<section class="location">
  <div class="map-wrap"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3380.8994022476236!2d34.78045333601136!3d32.071969516875924!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151d4b8266306a0d%3A0xe6ea880f447b9453!2sShlomo%20Ibn%20Gabirol%20St%209%2C%20Tel%20Aviv-Jaffa!5e0!3m2!1sen!2sil!4v1789370962857!5m2!1sen!2sil" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="location-action"><a class="nav-btn" href="https://www.google.com/maps/dir/?api=1&destination=Shlomo+Ibn+Gabirol+St+9%2C+Tel+Aviv-Jaffa" target="_blank" rel="noopener">נווטו אליי</a></div>
</section>

<footer>Tal Bitton</footer>
</main>

<script>


const dateInput=document.getElementById('date');
const dateDisplay=document.getElementById('dateDisplay');
const timeInput=document.getElementById('time');
const timeSlots=document.getElementById('timeSlots');
const slotsNote=document.getElementById('slotsNote');
const form=document.getElementById('bookingForm');
const formBox=document.getElementById('formBox');
const successBox=document.getElementById('successBox');
const successText=document.getElementById('successText');
const submitBtn=form.querySelector('.submit');

function pad(n){return String(n).padStart(2,'0')}

function setMinDate(){
  const now=new Date();
  dateInput.min=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
}
setMinDate();

function setSlotsState(type,text){
  timeInput.value='';
  timeSlots.innerHTML=`<div class="${type}">${text}</div>`;
}

function renderSlots(slots){
  timeSlots.innerHTML='';
  timeInput.value='';

  if(!slots?.length){
    timeSlots.innerHTML=`
      <div class="slots-empty">
        <span class="slots-empty-icon">×</span>
        <span>אין שעות פנויות ביום הזה</span>
      </div>`;
    slotsNote.textContent='אין זמינות';
    return;
  }

  slotsNote.textContent=`${slots.length} שעות פנויות`;

  const groups=[
    {label:'בוקר', from:0, to:12},
    {label:'צהריים', from:12, to:16},
    {label:'אחה״צ / ערב', from:16, to:24}
  ];

  groups.forEach(group=>{
    const groupSlots=slots.filter(slot=>{
      const hour=Number(slot.split(':')[0]);
      return hour>=group.from && hour<group.to;
    });

    if(!groupSlots.length) return;

    const wrap=document.createElement('div');
    wrap.className='slot-group';

    const label=document.createElement('div');
    label.className='slot-group-label';
    label.textContent=group.label;

    const grid=document.createElement('div');
    grid.className='slot-group-grid';

    groupSlots.forEach((slot,index)=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='slot-btn';
      btn.textContent=slot;
      btn.dataset.value=slot;
      btn.style.animationDelay=`${index*28}ms`;

      btn.addEventListener('click',()=>{
        timeSlots.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        timeInput.value=slot;
      });

      grid.appendChild(btn);
    });

    wrap.appendChild(label);
    wrap.appendChild(grid);
    timeSlots.appendChild(wrap);
  });
}

async function loadAvailability(){
  const date=dateInput.value;
  const service=form.querySelector('input[name="service"]:checked')?.value || '';

  if(!date){
    slotsNote.textContent='בחרו קודם תאריך';
    timeSlots.innerHTML='<div class="slots-empty"><span class="slots-empty-icon">◷</span><span>בחרו תאריך כדי לראות שעות פנויות</span></div>';
    return;
  }

  slotsNote.textContent='בודקים זמינות...';
  timeSlots.innerHTML='<div class="slots-loading"><span>בודקים את היומן...</span></div>';

  try{
    const params=new URLSearchParams({date,service});
    const res=await fetch(`/.netlify/functions/availability?${params.toString()}`);
    const data=await res.json();

    if(!res.ok) throw new Error(data.error || 'availability failed');
    renderSlots(data.slots);
  }catch(err){
    console.error(err);
    slotsNote.textContent='שגיאה בטעינה';
    setSlotsState('slots-empty','לא הצלחנו לטעון שעות כרגע');
  }
}

dateInput.addEventListener('change',()=>{
  if(dateInput.value){
    const [y,m,d]=dateInput.value.split('-');
    dateDisplay.textContent=`${d}/${m}/${y}`;
  }else{
    dateDisplay.textContent='בחרו תאריך';
  }
  loadAvailability();
});

form.querySelectorAll('input[name="service"]').forEach(el=>{
  el.addEventListener('change',()=>{
    if(dateInput.value) loadAvailability();
  });
});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();

  if(!timeInput.value){
    alert('בחרו שעה פנויה לפני קביעת התור.');
    return;
  }

  const fd=new FormData(form);
  const payload=Object.fromEntries(fd.entries());

  submitBtn.disabled=true;
  const oldText=submitBtn.querySelector('span')?.textContent || 'קביעת התור';
  if(submitBtn.querySelector('span')) submitBtn.querySelector('span').textContent='מאשרים את התור...';

  try{
    const res=await fetch('/.netlify/functions/book',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(res.status===409){
      alert('השעה הזאת נתפסה בדיוק עכשיו. בחרו שעה אחרת.');
      await loadAvailability();
      return;
    }

    if(!res.ok) throw new Error(data.error || 'booking failed');

    successText.textContent=`${payload.service} · ${payload.date} · ${payload.time}`;
    formBox.style.display='none';
    successBox.style.display='block';
  }catch(err){
    console.error(err);
    alert('לא הצלחנו לקבוע את התור כרגע. נסו שוב בעוד רגע.');
  }finally{
    submitBtn.disabled=false;
    if(submitBtn.querySelector('span')) submitBtn.querySelector('span').textContent=oldText;
  }
});

/* --- story-style video behavior: one video at a time, no horizontal scrolling --- */
(function(){
  const grid = document.getElementById('reelGrid');
  const reels = Array.from(grid.querySelectorAll('.reel'));
  const dotsWrap = document.getElementById('reelDots');
  const prevBtn = document.getElementById('storyPrev');
  const nextBtn = document.getElementById('storyNext');
  const videos = reels.map(r => r.querySelector('video'));
  let current = 0;

  reels.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'reel-dot' + (i === 0 ? ' is-active' : '');
    d.setAttribute('aria-hidden','true');
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function ensureLoaded(i){
    const v = videos[i];
    if(v?.dataset.src && !v.src){
      v.src = v.dataset.src;
      v.load();
    }
  }

  function showStory(index, autoplay=true){
    current = (index + reels.length) % reels.length;

    reels.forEach((reel,i)=>{
      const active = i === current;
      reel.classList.toggle('is-active', active);

      const video = videos[i];
      if(!video) return;

      if(active){
        ensureLoaded(i);
        if(autoplay) video.play().catch(()=>{});
      }else{
        video.pause();
      }
    });

    dots.forEach((dot,i)=>dot.classList.toggle('is-active', i===current));
  }

  prevBtn?.addEventListener('click',()=>showStory(current-1));
  nextBtn?.addEventListener('click',()=>showStory(current+1));

  reels.forEach((reel,i)=>{
    const video = videos[i];
    const muteBtn = reel.querySelector('.reel-mute');

    video?.addEventListener('ended',()=>showStory(current+1));

    muteBtn?.addEventListener('click',(e)=>{
      e.stopPropagation();
      const willUnmute = video.muted;
      videos.forEach(v=>{ if(v) v.muted = true; });
      video.muted = !willUnmute;

      reels.forEach((r,idx)=>{
        const b = r.querySelector('.reel-mute');
        if(b) b.dataset.muted = videos[idx]?.muted ? 'true' : 'false';
      });
    });
  });

  document.addEventListener('keydown',(e)=>{
    if(e.key === 'ArrowLeft') showStory(current+1);
    if(e.key === 'ArrowRight') showStory(current-1);
  });

  showStory(0,false);

  const section = document.querySelector('.lookbook');
  if(section){
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          ensureLoaded(current);
          videos[current]?.play().catch(()=>{});
        }else{
          videos[current]?.pause();
        }
      });
    },{threshold:.45});
    observer.observe(section);
  }
})();

</script>
</body>
